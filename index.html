<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pumpfoil Guru — Schiffenensee</title>
<meta name="description" content="Pumpfoil Guru — Wasserstand Schiffenensee für die drei Docks. Grün heisst los.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ── tokens ───────────────────────────────────────── */
:root{
  --abyss:#071A1E;
  --deep:#0B2A2E;
  --water:#0D4F4F;
  --water-lit:#1E9B8A;
  --molasse:#C9A063;
  --molasse-dim:#8A6E44;
  --bone:#EDE6D8;
  --muted:#7A9498;
  --go:#52C88A;
  --warn:#E6B245;
  --stop:#DC5B4A;
  --rule:rgba(201,160,99,.22);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Public Sans",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--abyss);
  color:var(--bone);
  font-family:var(--body);
  font-size:16px;line-height:1.5;
  padding:0 0 4rem;
  overflow-x:hidden;
}
.wrap{max-width:820px;margin:0 auto;padding:0 1.15rem}
.eyebrow{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--molasse-dim);
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:1rem;flex-wrap:wrap;
}
/* Ort und See in der ersten Zeile, Sonnenzeiten darunter, beide links bündig.
   Der Sprachumschalter richtet sich an der OBEREN Kante aus, nicht an der
   Mitte — sonst schwebte er zwischen den beiden Zeilen. */
.eyebrow .place{line-height:1.9}
.eyebrow .dot{color:var(--molasse);margin:0 .5em;letter-spacing:0}
/* Sprachumschalter. Sieht aus wie der übrige Kopf — dieselbe Schrift, dieselbe
   Grösse; nur die aktive Sprache ist hell. Kein Aufklappmenü: bei drei
   Sprachen ist Nebeneinander kürzer als jedes Menü. */
.langs{display:inline-flex;gap:.55em;letter-spacing:.18em}
.langs button{
  background:none;border:0;padding:0;cursor:pointer;
  font:inherit;letter-spacing:inherit;text-transform:uppercase;
  color:var(--molasse-dim);
}
.langs button[aria-current="true"]{color:var(--bone)}
.suntimes{display:inline-flex;align-items:center;gap:.35rem;letter-spacing:.08em}
.suntimes .dot{margin:0 .15em}
.suntimes span{display:inline-flex;align-items:center;gap:.3rem}
/* Höhe = Versalhöhe der Schrift daneben. JetBrains Mono hat capHeight
   730/1000, also .73em — und weil der Zeichenbereich eng zugeschnitten ist,
   ist das direkt die gezeichnete Höhe. Die Breite folgt dem
   Seitenverhältnis 21.8 : 11.8, also .73 × 1.847 = 1.3483em. */
.suntimes svg{height:.73em;width:1.3483em;flex:none}

/* ── masthead ─────────────────────────────────────── */
header{padding:2.2rem 0 1.4rem}
h1{
  font-family:var(--display);font-weight:800;
  font-size:clamp(2.4rem,11vw,3.6rem);line-height:.92;
  letter-spacing:-.035em;margin:.35rem 0 0;
}
h1 em{font-style:normal;color:var(--water-lit)}
.verdict{
  font-family:var(--display);font-weight:500;
  font-size:clamp(1.05rem,4.4vw,1.35rem);line-height:1.25;
  margin-top:.85rem;max-width:30ch;color:var(--bone);
}
.stamp{
  font-family:var(--mono);font-size:.7rem;color:var(--muted);
  margin-top:.7rem;
}
.stamp:empty{margin-top:0}

/* ── the gauge (signature) ────────────────────────── */
.reading{
  display:grid;grid-template-columns:76px 1fr;gap:1.1rem;
  align-items:stretch;margin-top:1.6rem;
}
.gauge{
  position:relative;border-radius:3px;overflow:hidden;
  background:linear-gradient(180deg,#14343A 0%,#0C2126 100%);
  border:1px solid var(--rule);min-height:340px;
}
.gauge .fill{
  position:absolute;left:0;right:0;bottom:0;height:0%;
  background:linear-gradient(180deg,var(--water-lit) 0%,var(--water) 42%,#08383B 100%);
  transition:height 1.1s cubic-bezier(.22,.75,.3,1);
}
.gauge .band{
  position:absolute;left:0;right:0;
  background:repeating-linear-gradient(-45deg,rgba(230,178,69,.30) 0 5px,rgba(230,178,69,0) 5px 10px);
  border-top:1px solid rgba(230,178,69,.55);
  border-bottom:1px solid rgba(230,178,69,.55);
  transition:bottom 1.1s ease,height 1.1s ease;
}
.gauge .ticks{position:absolute;inset:0}
.gauge .tick{
  position:absolute;left:0;right:0;height:1px;background:var(--rule);
}
.gauge .tick span{
  position:absolute;left:5px;top:-.62rem;
  font-family:var(--mono);font-size:.56rem;color:var(--molasse-dim);
}
.gauge .marker{
  position:absolute;left:0;right:0;height:2px;background:var(--bone);
  box-shadow:0 0 0 1px rgba(7,26,30,.7);
  transition:bottom 1.1s cubic-bezier(.22,.75,.3,1);
}
.gauge .notch{
  position:absolute;right:0;width:16px;height:2px;
  transition:bottom 1.1s ease;
}
.gauge .notch::after{
  content:attr(data-k);position:absolute;right:18px;top:-.55rem;
  font-family:var(--mono);font-size:.58rem;font-weight:700;
}

/* ── dock cards ───────────────────────────────────── */
.docks{display:flex;flex-direction:column;gap:.55rem}
.dock{
  border:1px solid var(--rule);border-radius:3px;
  background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,0));
  padding:.85rem .95rem;display:grid;
  grid-template-columns:auto 1fr auto;gap:.85rem;align-items:center;
  flex:1;
}
.lamp{
  width:19px;height:19px;border-radius:50%;flex:none;
  box-shadow:0 0 0 3px rgba(255,255,255,.05);
}
.lamp.go{background:var(--go);box-shadow:0 0 0 3px rgba(82,200,138,.16),0 0 16px rgba(82,200,138,.5)}
.lamp.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(230,178,69,.16),0 0 16px rgba(230,178,69,.45)}
.lamp.stop{background:var(--stop);box-shadow:0 0 0 3px rgba(220,91,74,.16)}
.lamp.off{background:#2A4046}
.dock h3{font-family:var(--display);font-weight:500;font-size:1.02rem;letter-spacing:-.01em}
.dock p{font-size:.76rem;color:var(--muted);margin-top:.1rem}
/* Sperrgrund in derselben Farbe wie die übrigen Hinweise — die rote Lampe
   daneben sagt schon deutlich genug, dass es nicht geht. */
.dock p .blocked{color:inherit}
a.dock{text-decoration:none;color:inherit}
a.dock:hover{
  border-color:rgba(201,160,99,.45);
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,0));
}
.dock .pin{color:var(--molasse-dim);display:flex;align-items:center;transition:color .15s}
.dock .pin svg{width:16px;height:16px;display:block}
a.dock:hover .pin{color:var(--molasse)}

/* ── Tagesreiter ──────────────────────────────────── */
.tabs{display:flex;gap:.4rem;margin-top:1.1rem;flex-wrap:wrap}
.tabs button{
  font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
  padding:.42rem .8rem;border-radius:99px;border:1px solid var(--rule);
  background:transparent;color:var(--muted);cursor:pointer;transition:.15s;
}
.tabs button:hover{color:var(--bone)}
.tabs button[aria-selected="true"]{
  background:var(--molasse);color:var(--abyss);border-color:transparent;font-weight:700;
}

/* ── strips ───────────────────────────────────────── */
section{margin-top:2.4rem}
h2{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--molasse-dim);font-weight:400;
  padding-bottom:.5rem;border-bottom:1px solid var(--rule);margin-bottom:.9rem;
}
/* Raster statt Flex-Umbruch. Vorher wurde jede Kachel so breit wie ihre
   längste Beschriftung — eine lange wie LUFTQUALITÄT schob die folgenden nach
   rechts, und die Spalten fluchteten von Zeile zu Zeile nicht mehr. Auf
   Englisch fiel es kaum auf, auf Deutsch und Französisch stark.

   92px Mindestbreite: die längste unumbrechbare Beschriftung ist
   LUFTQUALITÄT, zwölf Zeichen — in JetBrains Mono bei .6rem mit .12em
   Sperrung sind das 6.9 px je Zeichen, also 83 px. Auf 360 px Telefonbreite
   ergeben sich damit genau drei Spalten, auf breiteren Schirmen mehr. */
.now{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));
  gap:1.4rem 1.1rem;align-items:start;
}
/* Die vier Tagesabschnitte gehören in EINE Zeile — sonst stand "Abend" allein
   unter den anderen dreien. Bei 360 px sind das 80 px je Spalte; NACHMITTAG
   und APRÈS-MIDI brauchen 69 px, das passt. */
#wx{grid-template-columns:repeat(4,1fr);gap:1rem .6rem}
.metric .v.seg svg{width:30px;height:30px;display:block}
.metric .v.seg{height:auto}
.metric .v{font-family:var(--mono);font-size:1.34rem;font-weight:700;letter-spacing:-.02em}
.metric .k{
  font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-top:.15rem;line-height:1.5;
}
.metric .v small{font-size:.62rem;font-weight:400;color:var(--muted);letter-spacing:0}
/* Gleiche Schriftgrösse und Zeilenhöhe wie die Bezeichnung, kein Zusatzabstand.
   Nur so ist der Umbruch in "Wind-/richtung" gleich gross wie der Abstand
   zwischen Bezeichnung und Einstufung. */
.metric .q{
  font-family:var(--mono);font-size:.6rem;letter-spacing:.04em;
  color:var(--muted);line-height:1.5;
}


.fc{display:flex;flex-direction:column;gap:.4rem}
.fcrow{display:grid;grid-template-columns:60px 1fr auto;gap:.7rem;align-items:center;font-family:var(--mono);font-size:.72rem}
.fcrow .bar{height:7px;background:rgba(255,255,255,.06);border-radius:99px;position:relative;overflow:hidden}
.fcrow .bar i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--water),var(--water-lit));border-radius:99px}
.fcrow .lab{color:var(--muted)}

/* ── calibration ──────────────────────────────────── */
details{border:1px solid var(--rule);border-radius:3px;padding:.85rem 1rem}
summary{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--molasse);cursor:pointer;list-style:none;
}
summary::-webkit-details-marker{display:none}
summary::after{content:" ▸";}
details[open] summary::after{content:" ▾"}
footer{
  margin-top:3rem;padding-top:1.1rem;border-top:1px solid var(--rule);
  font-size:.72rem;color:var(--muted);line-height:1.7;
}
footer a{color:var(--molasse-dim)}
/* Quellen zugeklappt. <details> statt Javascript — dieselbe Schrift und Grösse
   wie der Rest des Fussbereichs, damit es nicht wie ein Bedienelement wirkt. */
footer details{margin-top:.55rem}
footer summary{
  cursor:pointer;color:var(--molasse-dim);width:fit-content;
}
footer summary::marker{color:var(--rule)}
footer details[open] summary{margin-bottom:.45rem}
.verdict .storm{
  display:inline-flex;align-items:baseline;gap:.3em;
  color:var(--warn);white-space:nowrap;
}
.verdict .storm svg{width:.85em;height:.85em;align-self:center;flex:none}

.warnbox{
  position:relative;padding:.55rem 0 .55rem .95rem;
  font-size:.78rem;color:var(--muted);margin-top:.9rem;
}
/* Schraffur statt Balken — dieselbe Musterung wie das Prognoseband an der
   Messlatte, damit sichtbar wird, dass sich der Hinweis genau darauf bezieht. */
.warnbox::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:7px;
  background:repeating-linear-gradient(-45deg,
    rgba(230,178,69,.5) 0 5px, rgba(230,178,69,0) 5px 10px);
  border-left:1px solid rgba(230,178,69,.55);
  border-right:1px solid rgba(230,178,69,.55);
}
:focus-visible{outline:2px solid var(--water-lit);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:430px){
  .reading{grid-template-columns:60px 1fr;gap:.8rem}
}
</style>
</head>

function pickLang(){
  const u = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(u)) return u;
  for (const l of (navigator.languages || [navigator.language || 'de'])){
    const p = String(l).slice(0, 2).toLowerCase();
    if (LANGS.includes(p)) return p;
  }
  return 'de';
}
let lang = pickLang();

/* Die Adressen stehen EINMAL hier, die Sätze drumherum je Sprache im
   Wörterbuch. Sonst müsste man eine geänderte URL an drei Stellen nachziehen.
   Die Groupe-E-Links zeigen bewusst auf die deutschen Seiten: die
   französischen Entsprechungen sind nicht durchgehend geprüft, und ein
   funktionierender Link in der falschen Sprache ist besser als ein toter. */
const SRC = {
  gE:'https://www.groupe-e.ch/de/ueber-groupe-e/wasserstand-seen/schiffenen',
  s2215:'https://www.hydrodaten.admin.ch/de/seen-und-fluesse/stationen-und-daten/2215',
  s2119:'https://www.hydrodaten.admin.ch/de/seen-und-fluesse/stationen-und-daten/2119',
  bafu:'https://www.bafu.admin.ch',

};

/* Fällt ein Schlüssel in einer Sprache aus, greift Deutsch — lieber ein
   deutsches Wort als ein leeres Feld oder der rohe Schlüsselname. */
function T(key, vars){
  let v = I18N[lang][key];
  if (v === undefined) v = I18N.de[key];
  if (v === undefined) return key;
  if (vars) for (const k in vars) v = v.split('{' + k + '}').join(vars[k]);
  return v;
}

function renderSources(){
  const el = document.querySelector('#src');
  if (!el) return;
  const a = (href, text) => `<a href="${href}">${text}</a>`;
  const L = {
    gE:a(SRC.gE, 'Groupe E'),
    l2215:a(SRC.s2215, 'Saane – Laupen (2215)'),
    l2119:a(SRC.s2119, 'Sarine – Fribourg (2119)'),
    bafu:a(SRC.bafu, T('bafuName')),
    existenz:a(SRC.existenz, 'api.existenz.ch'),
    om:a(SRC.om, 'Open-Meteo'),
    vario:a(SRC.vario, 'Groupe E VARIO')
  };
  el.innerHTML = ['srcLevel','srcFlow','srcWx','srcPrice'].map(k => T(k, L)).join('<br>');
}

/* Alles neu beschriften. Wird beim Start und bei jedem Wechsel gerufen —
   die Seite wird nicht neu geladen, damit der gewählte Tag stehen bleibt. */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = T(el.dataset.i18n);
  });
  const box = document.querySelector('#langs');
  if (box){
    box.innerHTML = LANGS.map(l =>
      `<button type="button" data-l="${l}" aria-current="${l === lang}"`
      + ` lang="${l}">${l}</button>`).join('');
    box.onclick = e => {
      const b = e.target.closest('button');
      if (b && b.dataset.l !== lang) setLang(b.dataset.l);
    };
  }
  renderSources();
  renderTabs(); renderAll(); renderWeather();
  if (typeof forecast !== 'undefined' && forecast.length) renderFC(forecast);
}

/* Die Wahl hält über die Adresse, nicht über localStorage — Projektregel.
   replaceState statt href-Zuweisung: kein Neuladen, kein neuer Verlaufseintrag,
   der Zurück-Knopf bleibt brauchbar. Wer die Seite mit ?lang=fr als Lesezeichen
   ablegt, bekommt immer Französisch. */
function setLang(l){
  if (!LANGS.includes(l)) return;
  lang = l;
  const u = new URL(location.href);
  u.searchParams.set('lang', l);
  history.replaceState(null, '', u);
  applyLang();
}

/* ── Zustand ───────────────────────────────────────── */
/* Aus den gemessenen Abständen werden hier einmalig absolute Pegel. Ändert sich
   refLevel, verschieben sich alle Docks gemeinsam — ihre Abstände bleiben. */
let docks = CONFIG.docks.map(d => ({
  ...d,
  stopLow: d.stopLowRel == null ? undefined : +(CONFIG.refLevel + d.stopLowRel).toFixed(2),
  goLow:   d.goLowRel   == null ? undefined : +(CONFIG.refLevel + d.goLowRel).toFixed(2)
}));
let levelMin = null, levelMax = null, measured = null, levelStamp = null;
/* Anlässe des Ruderclubs Vevey in Schiffenen, aus data/level.json.
   rowingDay hält den Anlass des gerade gewählten Tages, sonst null. */
let rowing = [], rowingDay = null;
const rowingOn = iso => rowing.find(e => iso >= e.from && iso <= e.to) || null;

/* Groupe E liefert mehrere Tage. dayIdx wählt, welcher gezeigt wird —
   Pegel, Ampeln und Wetter hängen alle daran. Abfluss gibt es nur für heute. */
const DAYS = () => T('days');
let forecast = [], dayIdx = 0, measuredRaw = null, wx = null, storm = null;
let manual = {...CONFIG.manual};

const $ = s => document.querySelector(s);
const fmt = n => n == null ? '–' : n.toFixed(2);
const pct = m => Math.max(0, Math.min(100,
  (m - CONFIG.scale.min) / (CONFIG.scale.max - CONFIG.scale.min) * 100));

/* ── Windstärke in Worten (Beaufort) ───────────────── */
/* Beaufort. Das kurze Wort ist von der Kachel verschwunden — dort stehen
   Knoten — und lebt nur noch im Tooltip weiter, wo es die Skala erklärt. */
const BFT = [1, 6, 12, 20, 29, 39, 50, 62, 75, 89, 1e9];
const windWord = k => {
  const i = BFT.findIndex(m => k < m);
  return `${T('bft')[i]}${i ? ` · ${i} Bft` : ''}`;
};

/* Knoten statt Beaufort-Wort auf der Kachel. Die amtlichen Wörter sind fürs
   Pumpfoilen irreführend: „mässige Brise" ist für uns schon fast zu viel.
   Knoten sind die Einheit, in der Wassersportler denken, und sagen nichts,
   was sie nicht messen. Das Beaufort-Wort bleibt im Tooltip stehen.
   Unter 10 kn eine Nachkommastelle — dort unten entscheidet sich, ob es
   spiegelglatt ist, und 3 gegen 4 Knoten ist ein spürbarer Unterschied. */
const kn = kmh => {
  const k = kmh / 1.852;
  return `${k < 10 ? k.toFixed(1) : Math.round(k)} kn`;
};

/* Windrichtung ist meteorologisch die Richtung, aus der es weht.
   270° heisst Westwind — der Wind kommt von Westen. */
const UV_S = [3, 6, 8, 11, 1e9];
const uvWord = v => T('uv')[UV_S.findIndex(m => v < m)];

/* European Air Quality Index, Skala der EEA */
const AQI_S = [20, 40, 60, 80, 100, 1e9];
const aqiWord = v => T('aqW')[AQI_S.findIndex(m => v < m)];

/* Sichtweite. Die Grenzen folgen der gängigen meteorologischen Einteilung:
   unter 1 km ist definitionsgemäss Nebel, darüber Dunst in Abstufungen.
   Keine amtliche Schweizer Norm, aber verbreitet und nachvollziehbar. */
const SICHT_S = [1, 4, 10, 1e9];
const sichtWord = km => T('visW')[SICHT_S.findIndex(m => km < m)];

/* Tagesabschnitte. Die Stunden sind so gewählt, dass sie zum Pumpfoilen
   passen — nicht meteorologisch, sondern praktisch. */
const ABSCHNITTE = [[6,11],[11,14],[14,18],[18,22]];

/* Die Kürzel sind sprachabhängig, und zwar heimtückisch: französisch O steht
   für Ouest, also Westen — deutsch O für Ost. Deshalb je Sprache eine Liste. */
const dirWord = deg => T('dirs')[Math.round((((deg % 360) + 360) % 360) / 22.5) % 16];

/* ── Ampel-Logik ───────────────────────────────────── */
function rate(dock, m){
  if (m == null) return 'off';
  if (m < dock.stopLow || m > dock.stopHigh) return 'stop';
  if (m < dock.goLow   || m > dock.goHigh)   return 'warn';
  return 'go';
}
// Aufzaehlung: "A, B und C" statt "A und B und C"
const list = a => a.length < 2 ? (a[0] || '')
  : a.slice(0, -1).join(', ') + T('and') + a[a.length - 1];

function statusFor(dock){
  // Manuelle Sperren gehen dem Pegel vor
  if (dock.manual && !manual.dock4_installed)
    return { s:'stop', split:false, why:T('outOfOrder') };
  if (dock.rowing && manual.rowing_competition)
    return { s:'stop', split:false, why:T('closedRace') };

  // Kalender des Ruderclubs: orange, nicht rot. Der See ist belegt, gesperrt
  // ist er nicht — die Einschätzung bleibt beim Fahrer. Steht bewusst VOR der
  // Schwimmsteg-Regel, sonst käme Dock 4 nie hierher.
  if (dock.regatta && rowingDay)
    return { s:'warn', split:false,
             note: rowingDay.kind === 'race' ? T('race') : T('training') };

  // Schwimmsteg hebt und senkt sich mit dem Wasser — der Pegel ist ihm egal.
  // Er hat deshalb gar keine Schwellen und steht nicht an der Messlatte.
  if (dock.floating) return { s:'go', split:false, note:T('floats') };

  if (measured != null) return { s: rate(dock, measured), split:false };
  if (levelMin == null) return { s:'off', split:false };
  const a = rate(dock, levelMin), b = rate(dock, levelMax);
  if (a === b) return { s:a, split:false };
  return { s:'warn', split:true };
}

/* ── Rendern ───────────────────────────────────────── */
function renderTicks(){
  const t = $('#ticks'); t.innerHTML = '';
  for (let m = Math.ceil(CONFIG.scale.min*2)/2; m <= CONFIG.scale.max; m += 0.5){
    const el = document.createElement('div');
    el.className = 'tick';
    el.style.bottom = pct(m) + '%';
    el.innerHTML = `<span>${m.toFixed(1)}</span>`;
    t.appendChild(el);
  }
}

function renderGauge(){
  const show = measured != null ? measured : (levelMax != null ? (levelMin+levelMax)/2 : null);
  $('#fill').style.height = (show == null ? 0 : pct(show)) + '%';

  const band = $('#band');
  if (measured == null && levelMin != null){
    band.hidden = false;
    band.style.bottom = pct(levelMin) + '%';
    // KEIN Mindestwert. Die Latte deckt 5 m ab, 2 % waren also 10 cm — jedes
    // Band unter 10 cm wurde zu gross und alle sahen gleich aus (9, 3 und 8 cm
    // am 29.08.2026 identisch). Sichtbar bleibt ein schmales Band trotzdem:
    // die 1-px-Ränder oben und unten werden immer gezeichnet, box-sizing ist
    // border-box. Ein 3-cm-Band IST auf dieser Latte eine Linie.
    band.style.height = Math.max(0, pct(levelMax) - pct(levelMin)) + '%';
  } else band.hidden = true;

  const mk = $('#marker');
  if (measured != null){ mk.hidden = false; mk.style.bottom = pct(measured) + '%'; }
  else mk.hidden = true;

  document.querySelectorAll('.notch').forEach(n => n.remove());
  const g = $('#gauge');
  // Mehrere Docks können dieselbe Grenze haben (D3 und D4 beide bei 528.00).
  // Dann werden die Kürzel zusammengefasst und nur einmal geschrieben, sonst
  // liegen die Beschriftungen unleserlich aufeinander.
  const sharing = {};
  const gauged = docks.filter(d => d.stopLow != null);   // Schwimmsteg faellt raus
  gauged.forEach(d => {
    const key = d.stopLow.toFixed(2);
    (sharing[key] = sharing[key] || []).push(d.short);
  });
  const labelled = new Set();

  // Nur die Untergrenze, in Rot, beschriftet. Die gelben Marken (ab hier grün)
  // sind raus — sie machten die Latte voll, ohne mehr zu sagen als die Ampel.
  gauged.forEach(d => {
    const key = d.stopLow.toFixed(2);
    if (labelled.has(key)) return;             // D3 und D4 teilen sich eine Höhe
    labelled.add(key);
    const n = document.createElement('div');
    n.className = 'notch';
    n.dataset.k = sharing[key].join(' ');
    n.style.bottom = pct(d.stopLow) + '%';
    n.style.background = 'var(--stop)';
    n.style.opacity = '.85';
    g.appendChild(n);
  });
}

// Warndreieck nach ISO 7010 W001: gelbes Dreieck, schwarzer Rand, Ausrufezeichen
const WARNSIGN = `<svg viewBox="0 0 24 24" aria-hidden="true">
  <path d="M12 2.4 22.6 21.2H1.4z" fill="#E6B245" stroke="#071A1E"
        stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M12 9.2v5.1" stroke="#071A1E" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="12" cy="17.7" r="1.2" fill="#071A1E"/></svg>`;

// Sonnenauf- und -untergang. Bewusst in der Farbe der Kopfzeile, nicht gelb —
// das sind Zeitangaben, keine Warnung.
/* Sonne über der Linie heisst Aufgang, unter der Linie Untergang. Die
   Anordnung trägt die Aussage — deshalb brauchen die Symbole keine Pfeile mehr
   wie die vorherige Fassung, wo sie sich nur durch ein kleines Detail
   unterschieden. Auf acht Pixel Höhe ist das ein spürbarer Unterschied.

   Der Untergang ist eine exakte 180°-Drehung um die Bildmitte: (x,y) wird zu
   (24−x, 24−y), der Bogen kippt über die Sweep-Flagge von 1 auf 0. Folge:
   beide zeichnen exakt 11.8 der 24 Einheiten und sind damit von selbst gleich
   hoch. Die vorige Fassung war um 12 % verschieden, weil ihre Strahlen
   unterschiedlich weit reichten.

   Der Zeichenbereich ist eng zugeschnitten, damit die Höhenangabe im CSS
   direkt die gezeichnete Höhe ist. Seitenverhältnis 21.8 : 11.8 = 1.847. */
const SUN_UP = `<svg viewBox="1.1 9.1 21.8 11.8" fill="none" stroke="currentColor"
  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M2 20h20"/><path d="M7 20a5 5 0 0 1 10 0"/>
  <path d="M12 13v-3"/><path d="M7.1 15.1 4.9 12.9"/><path d="M16.9 15.1 19.1 12.9"/></svg>`;
const SUN_DOWN = `<svg viewBox="1.1 3.1 21.8 11.8" fill="none" stroke="currentColor"
  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M2 4h20"/><path d="M7 4a5 5 0 0 0 10 0"/>
  <path d="M12 11v3"/><path d="M16.9 8.9 19.1 11.1"/><path d="M7.1 8.9 4.9 11.1"/></svg>`;

const PIN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M12 21.5s6.8-6.1 6.8-10.8a6.8 6.8 0 1 0-13.6 0C5.2 15.4 12 21.5 12 21.5z"/>
  <circle cx="12" cy="10.4" r="2.5"/></svg>`;

function renderDocks(){
  const wrap = $('#docks'); wrap.innerHTML = '';
  docks.forEach(d => {
    const { s, split, why, note } = statusFor(d);
    // Mit Kartenlink wird die Karte selbst zum Link — nur unten bei den Ampeln,
    // nicht in der Zusammenfassung oben.
    const el = document.createElement(d.map ? 'a' : 'div');
    el.className = 'dock';
    if (d.map){
      el.href = d.map;
      el.target = '_blank';
      el.rel = 'noopener';
      el.title = T('mapOpen', { n:d.name });
    }
    // calibrated bleibt in der Config als Notiz für uns, wird aber nicht angezeigt
    const sub = why   ? `<span class="blocked">${why}</span>`
              : note  ? note
              : split ? T('swings')
              : '';
    // Tiefe beim prognostizierten Tagestiefstand — die Zahl, die zählt
    const cm = depthWord(depthAt(d, levelMin));
    const tief = cm == null ? '' : T('depth', { n:cm });
    const zeilen = [sub, tief].filter(Boolean).join(' · ');
    el.innerHTML = `
      <span class="lamp ${s}"></span>
      <div>
        <h3>${d.name}${d.place ? ` (${d.place})` : ''}</h3>
        ${zeilen ? `<p>${zeilen}</p>` : ''}
      </div>
      <span class="pin">${d.map ? PIN : ''}</span>`;
    wrap.appendChild(el);
  });
}

function renderVerdict(){
  const v = $('#verdict');
  if (levelMin == null && measured == null){ v.textContent = T('noLevel'); return; }
  const st      = docks.filter(d => d.summary !== false).map(d => ({ d, ...statusFor(d) }));
  const blocked = st.filter(x => x.why);
  const open    = st.filter(x => !x.why);
  const good    = open.filter(x => x.s === 'go').map(x => x.d.name);
  const iffy    = open.filter(x => x.s === 'warn').map(x => x.d.name);

  let txt;
  if (!open.length)                     txt = T('allBlocked');
  else if (good.length === open.length) txt = open.length === 1
                                            ? T('goes', { x:good[0] }) : T('allGo');
  else if (good.length)                 txt = T(good.length > 1 ? 'goPl' : 'goes', { x:list(good) })
                                            + (iffy.length ? ' ' + T('limit', { x:list(iffy) }) : '');
  else if (iffy.length)                 txt = T('limit', { x:list(iffy) });
  else                                  txt = T('nothing');
  if (blocked.length) txt += ' ' + T('blockedS', { x:list(blocked.map(x => x.d.name)) });

  // Ruderbetrieb gilt für den gewählten Tag, nicht nur für heute — man schaut
  // ja gerade nach, ob morgen etwas geht.
  let extra = '';
  if (rowingDay){
    const wort = rowingDay.kind === 'race' ? T('race') : T('training');
    const heute = dayIdx === 0 ? DAYS()[0] + ' ' : '';
    extra += ` <span class="storm" title="${rowingDay.name.replace(/"/g,'')}">`
           + `${WARNSIGN}${heute}${wort}.</span>`;
  }
  if (storm && dayIdx === 0){
    const t = s => s ? new Date(s).toLocaleTimeString(LOCALE[lang],
      { hour:'2-digit', minute:'2-digit' }) : '';
    const kommt = storm.onset && new Date(storm.onset) > new Date();
    const wort = kommt ? T('stormFrom', { t:t(storm.onset) }) : T('stormNow');
    const tip = [storm.event, storm.severity, storm.area,
                 storm.expires ? t(storm.expires) : ''].filter(Boolean).join(' · ');
    extra += ` <span class="storm" title="${tip}">${WARNSIGN}${wort}.</span>`;
  }
  v.innerHTML = txt.replace(/&/g,'&amp;').replace(/</g,'&lt;') + extra;

  // Die Prognosezeile ist bewusst weg — dieselbe Spanne steht unten bei
  // "Seepegel-Prognose Groupe E". Sobald der eigene Sensor misst, erscheint
  // hier die echte Messung; das ist etwas anderes als eine Prognose.
  const s = $('#stamp');
  s.textContent = measured != null
    ? T('measuredAt', { v:fmt(measured), t:levelStamp || '' }) : '';

  const note = $('#bandnote');
  // Erscheint, solange keine echte Messung da ist — auch bei schmalem Band.
  // Vorher lag die Schwelle bei 15 cm, wodurch der Hinweis an genau den
  // interessanten Tagen verschwand (29.08.2026: 9, 3 und 8 cm, also an drei
  // von vier Tagen nichts). Ein 3-cm-Band ist genau, aber immer noch eine
  // Prognose, und das muss dastehen.
  if (measured == null && levelMin != null){
    note.hidden = false;
    // Der Abflusshinweis gilt nur heute: die Kachel unten zeigt den aktuellen
    // Wert, für morgen und übermorgen gibt es keinen.
    const jetzt = dayIdx === 0 ? T('bandToday') : '';
    note.innerHTML = T('bandNote', { n:Math.round((levelMax-levelMin)*100) }) + jetzt;
  } else note.hidden = true;
}

function renderAll(){ renderGauge(); renderDocks(); renderVerdict(); }

function renderTabs(){
  const t = $('#tabs');
  const n = Math.max(1, Math.min(DAYS().length, forecast.length));
  t.innerHTML = DAYS().slice(0, n).map((lab, i) =>
    `<button role="tab" data-i="${i}" aria-selected="${i === dayIdx}">${lab}</button>`).join('');
  t.onclick = e => {
    const b = e.target.closest('button');
    if (b) { dayIdx = +b.dataset.i; applyDay(); }
  };
}

function applyDay(){
  const f = forecast[dayIdx];
  levelMin = f ? f.min : null;
  levelMax = f ? f.max : null;
  // TT.MM.JJJJ aus der Prognose in JJJJ-MM-TT, damit sich Zeichenketten
  // vergleichen lassen — kein Date-Objekt, keine Zeitzonenfallen.
  rowingDay = f ? rowingOn(`${f.date.slice(6)}-${f.date.slice(3,5)}-${f.date.slice(0,2)}`) : null;
  measured = dayIdx === 0 ? measuredRaw : null;   // Sensormessung gilt nur für heute
  renderTabs(); renderAll(); renderWeather();
}

/* ── Wetter-Icons ──────────────────────────────────── */
function icon(code, big){
  const c = 'var(--molasse)', b = 'var(--muted)', y = 'var(--warn)', w = 'var(--water-lit)';
  // Die Sonne sass auf cx/cy 18 — das ist die Position fuers Hervorlugen hinter
  // der Wolke (Code 2). Allein stehend wirkte sie als versetzter Punkt oben links.
  // Bei klarem Himmel jetzt zentriert und mit Strahlen.
  const sun = `<circle cx="22" cy="22" r="8" fill="${y}"/>`
    + `<g stroke="${y}" stroke-width="2.2" stroke-linecap="round">`
    + `<path d="M22 6v4M22 34v4M6 22h4M34 22h4`
    + `M10.7 10.7l2.8 2.8M30.5 30.5l2.8 2.8M33.3 10.7l-2.8 2.8M13.5 30.5l-2.8 2.8"/></g>`;
  const cloud = `<path d="M12 30h17a6 6 0 0 0 .4-12 8.5 8.5 0 0 0-16.2 2.2A5.2 5.2 0 0 0 12 30z" fill="${b}"/>`;
  const rain = `<g stroke="${w}" stroke-width="2.2" stroke-linecap="round"><path d="M15 33l-1.5 5M22 33l-1.5 5M29 33l-1.5 5"/></g>`;
  const snow = `<g stroke="${'#BFD8DA'}" stroke-width="2" stroke-linecap="round"><path d="M15 35h3M28 35h3M21.5 33v4"/></g>`;
  const bolt = `<path d="M23 32l-5 7h4l-2 6 7-9h-4l2-4z" fill="${y}"/>`;
  let g;
  if (code === 0 || code === 1) g = sun;
  else if (code === 2) g = `<circle cx="15" cy="16" r="6.5" fill="${y}"/>` + cloud;
  else if (code === 3 || code === 45 || code === 48) g = cloud;
  else if (code >= 95) g = cloud + bolt;
  else if (code >= 71 && code <= 77 || code === 85 || code === 86) g = cloud + snow;
  else g = cloud + rain;
  return `<svg viewBox="0 0 44 44" aria-hidden="true">${g}</svg>`;
}
/* Wettercode auf einen Platz in T('sky'). Die Wortliste steht bei den Sprachen,
   die Zuordnung Code -> Platz ist sprachunabhängig und deshalb hier. */
const SKY_I = {0:0, 1:1, 2:2, 3:3, 45:4, 48:4, 51:5, 53:5, 55:5, 61:6, 63:6, 65:7,
  71:8, 73:8, 75:8, 80:9, 81:9, 82:10, 95:11, 96:11, 99:11};
const skyWord = code => (SKY_I[code] == null ? '' : T('sky')[SKY_I[code]]);

/* ── Daten holen ───────────────────────────────────── */
async function loadLevel(){
  try{
    const r = await fetch('data/level.json?t=' + Date.now());
    if (!r.ok) throw 0;
    const d = await r.json();
    forecast = d.forecast || [];
    if (d.measured && d.measured.level != null){
      measuredRaw = d.measured.level;
      levelStamp = new Date(d.measured.time).toLocaleString(LOCALE[lang],{hour:'2-digit',minute:'2-digit'});
    }
    if (d.manual) manual = {...manual, ...d.manual};   // Sperren aus data/level.json
    storm = d.warning || null;   // fehlt, wenn keine Gewitterwarnung gilt
    rowing = (d.rowing && d.rowing.events) || [];
    // hydro.stats / sarine.stats bleiben in level.json — als Beleg für die
    // Zweigipfligkeit im CODEBOOK. Die Seite braucht sie nicht mehr.
    if (d.hydro && flowVal == null && d.hydro.flow != null) flowVal = d.hydro.flow;
    if (d.sarine && flowIn == null && d.sarine.flow != null) flowIn = d.sarine.flow;
    renderFlow();
    renderFC(forecast);
  }catch(e){
    $('#fc').innerHTML = `<span class="stamp">${T('noFc')}</span>`;
  }
  applyDay();
}

function renderFC(list){
  const el = $('#fc');
  if (!list.length){ el.innerHTML = `<span class="stamp">${T('noFcEmpty')}</span>`; return; }
  const lo = Math.min(...list.map(d=>d.min)), hi = Math.max(...list.map(d=>d.max));
  const span = Math.max(0.3, hi - lo);
  el.innerHTML = list.map((d,i) => {
    const l = (d.min - lo) / span * 100, w = Math.max(3,(d.max - d.min) / span * 100);
    return `<div class="fcrow">
      <span class="lab">${i===0 ? T('todayShort') : d.date.slice(0,5)}</span>
      <span class="bar"><i style="left:${l}%;width:${w}%"></i></span>
      <span>${d.min.toFixed(2)}–${d.max.toFixed(2)}</span>
    </div>`;
  }).join('');
}

async function loadWeather(){
  const { lat, lon } = CONFIG.weather;
  const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    + `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,uv_index,visibility,precipitation_probability`
    + `&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,uv_index_max,precipitation_probability_max,sunrise,sunset`
    + `&hourly=weather_code,temperature_2m,precipitation_probability,visibility`
    + `&timezone=Europe/Zurich&forecast_days=4`;
  try{
    wx = await (await fetch(u)).json();

/* Eine Kachel: Wert gross, darunter die Bezeichnung, darunter die Einordnung.
   Die Einordnung auf eigener Zeile — sonst wird "Luftqualität · sehr gut"
   so breit, dass wenige Kacheln pro Zeile passen. */
function tile(value, label, qual, opts){
  const o = opts || {};
  return `<div class="metric"${o.id ? ` id="${o.id}"` : ''}`
    + `${o.title ? ` title="${o.title}"` : ''}>`
    + `<div class="v${o.cls ? ' ' + o.cls : ''}">${value}</div>`
    + `<div class="k">${label}</div>`
    + (qual ? `<div class="q">${qual}</div>` : '')
    + `</div>`;
}

/* Fasst die Stundenwerte eines Tages zu vier Abschnitten zusammen.
   Für den Wettercode gewinnt der SCHLECHTESTE der Stunden — bei
   "Sonne bis 15 Uhr, dann Gewitter" ist das Gewitter die Information. */
function abschnitte(dateStr){
  if (!wx || !wx.hourly) return [];
  const h = wx.hourly;
  return ABSCHNITTE.map(([von, bis], nr) => {
    const lab = T('parts')[nr];
    const idx = h.time.map((t, i) => [t, i])
      .filter(([t]) => t.slice(0, 10) === dateStr
                    && +t.slice(11, 13) >= von && +t.slice(11, 13) < bis)
      .map(([, i]) => i);
    if (!idx.length) return null;
    const temps = idx.map(i => h.temperature_2m[i]).filter(v => v != null);
    const codes = idx.map(i => h.weather_code[i]).filter(v => v != null);
    return {
      lab,
      code: codes.length ? Math.max(...codes) : null,
      tmin: temps.length ? Math.min(...temps) : null,
      tmax: temps.length ? Math.max(...temps) : null,
      regen: Math.max(...idx.map(i => h.precipitation_probability[i] ?? 0))
    };
  }).filter(Boolean);
}

/* Regenwahrscheinlichkeit der nächsten drei Stunden — nicht des ganzen Tages.
   Was in acht Stunden passiert, hilft beim Losfahren nicht. */
function regen3h(){
  if (!wx || !wx.hourly) return null;
  const h = wx.hourly, jetzt = new Date();
  const ab = h.time.findIndex(t => new Date(t) >= jetzt);
  if (ab < 0) return null;
  const w = h.precipitation_probability.slice(ab, ab + 3).filter(v => v != null);
  return w.length ? Math.max(...w) : null;
}

function renderWeather(){
  if (!wx) return;
  const i = dayIdx, c = wx.current, dy = wx.daily;

  const ort = CONFIG.weather.place;
  $('#wxhead').textContent  = T('wxIn', { d:DAYS()[i].toLowerCase(), p:ort });
  $('#nowhead').textContent = i === 0 ? T('nowIn', { p:ort }) : `${DAYS()[i]} · ${ort}`;

  const sr = dy.sunrise[i].slice(11), ss = dy.sunset[i].slice(11);

  // Heute: Momentanwerte. Morgen/Übermorgen: Tageswerte aus der Prognose.
  const code = i === 0 ? c.weather_code    : dy.weather_code[i];
  const wind = i === 0 ? c.wind_speed_10m  : dy.wind_speed_10m_max[i];
  const gust = i === 0 ? c.wind_gusts_10m  : dy.wind_gusts_10m_max[i];
  const dir  = i === 0 ? c.wind_direction_10m : dy.wind_direction_10m_dominant[i];
  const uv   = i === 0 ? c.uv_index : dy.uv_index_max[i];
  const temp = i === 0 ? `${Math.round(c.temperature_2m)}°`

  const heute = i === 0;
  const datum = dy.time[i];
  const sicht = heute && c.visibility != null ? c.visibility / 1000 : null;
  const rgn   = heute ? regen3h() : dy.precipitation_probability_max[i];
  const feel  = heute ? c.apparent_temperature
    : `${Math.round(dy.apparent_temperature_max[i])}°<small> / ${Math.round(dy.apparent_temperature_min[i])}°</small>`;

  // Erste Zeile: nur die vier Tagesabschnitte. Danach ein erzwungener Umbruch,
  // damit die Messgrössen geschlossen darunter stehen.
  const teile = abschnitte(datum);
  $('#wx').innerHTML = teile.length
    ? teile.map(a => tile(icon(a.code), a.lab,
        a.tmin == null ? '' : `${Math.round(a.tmin)}–${Math.round(a.tmax)}°`,
        { cls:'seg', title:`${skyWord(a.code)} · ${T('rainTo', { n:a.regen })}` })).join('')
    : `<span class="stamp">${T('noWx')}</span>`;

  $('#now').innerHTML =
      tile(heute ? `${Math.round(c.temperature_2m)}°` : temp, T('air'),
           heute ? T('temp') : T('maxmin'))
    + tile(heute ? `${Math.round(feel)}°` : feel, T('air'), T('feels'),
           { title:T('feelsT') })
    + (rgn == null ? '' : tile(`${Math.round(rgn)}<small> %</small>`, T('rain'), T('chance')))
    + tile(`${Math.round(wind)}<small> km/h</small>`, heute ? T('wind') : T('windMax'),
           kn(wind), { title:windWord(wind) })
    + tile(`${Math.round(gust)}<small> km/h</small>`, heute ? T('gust') : T('gustMax'),
           kn(gust), { title:windWord(gust) })
    + tile(dirWord(dir), T('windDir'), '',
           { title:T('windFrom', { d:dirWord(dir), g:Math.round(dir) }) })
    + (heute ? tile('–', T('aq'), '', { id:'aqi' }) : '')
    + (sicht == null ? '' : tile(`${sicht < 10 ? sicht.toFixed(1) : Math.round(sicht)}<small> km</small>`,
           T('vis'), sichtWord(sicht), { title:T('visT') }))
    + tile(uv.toFixed(1), heute ? 'UV' : 'UV max', uvWord(uv),
           { title:T('uvT') })
    + (heute ? tile('–', T('inflow'), '', { id:'flowin' })
             + tile('–', T('outflow'), '', { id:'flow' })
             + tile('–', T('level'), '', { id:'trend' }) : '');

  $('#suntimes').innerHTML =
      `<span title="${T('sunUp')}">${SUN_UP}${sr}</span>`
    + `<span class="dot">·</span>`
    + `<span title="${T('sunDown')}">${SUN_DOWN}${ss}</span>`;

  if (i === 0){ renderFlow(); renderAir(); }   // nur für heute — keine Prognose dafür
}

/* Abfluss und Zufluss holt der Browser live von api.existenz.ch; der Stand aus
   level.json ist nur der Notnagel. Das Wort daneben kommt aus flowState und
   braucht kein Archiv — siehe CONFIG.turbine. */
let flowVal = null, flowIn = null;

// Pfeil als Schriftzeichen, damit er exakt auf derselben Grundlinie sitzt wie
// die Zahlen daneben und dieselbe Farbe hat.
const ARROW = { up:'↑', down:'↓', flat:'→' };

/* Zufluss minus Abfluss. Positiv heisst: es kommt mehr an, als abfliesst.
   Gewertet wird nicht die Bilanz selbst, sondern was sie am Pegel bewirkt —
   ein Kubikmeter pro Sekunde bewegt diesen See um ganze 2 cm pro Tag. */
const cmPerDay = q => q * 86400 / CONFIG.lakeArea * 100;

/* Wassertiefe an einem Dock bei gegebenem Seepegel. Der Seegrund liegt
   refLevel minus gemessene Tiefe — das ist einmalig aus der Messung vom
   25.08.2026 bestimmt und ändert sich nicht mehr. */
function depthAt(dock, level){
  if (dock.groundRel == null || level == null) return null;
  return level - (CONFIG.refLevel + dock.groundRel);
}

/* Konservativ auf volle 10 cm abgerundet: 193 → 190. Eine Prognose soll nicht
   genauer aussehen, als sie ist, und abrunden ist die sichere Richtung. */
const depthWord = m => m == null ? null : Math.floor(m * 10) * 10;

function trendOf(qin, qout){
  if (qin == null || qout == null) return null;
  const d = qin - qout;
  const rate = cmPerDay(d);
  if (Math.abs(rate) < CONFIG.trendDeadbandCmPerDay)
    return { k:'flat', word:T('trend')[2], d, rate };
  return d > 0 ? { k:'up', word:T('trend')[0], d, rate }
               : { k:'down', word:T('trend')[1], d, rate };
}

/* Turbiniert oder nicht — die einzige Aussage, die diese Verteilung hergibt.
   Braucht kein Archiv und ist ab dem ersten Messwert gültig, anders als die
   Perzentile, die vorher hier standen und 300 Werte gebraucht hätten. */
function flowState(v, t){
  if (v == null) return null;
  if (v >= t.on)   return T('flow')[0];
  if (v <= t.calm) return T('flow')[1];
  return T('flow')[2];
}

function renderFlow(){
  const inEl = $('#flowin'), outEl = $('#flow'), trEl = $('#trend');

  if (inEl && flowIn != null){
    const wi = flowState(flowIn, CONFIG.turbine.in);
    inEl.title = T('inflowT');
    inEl.innerHTML = `<div class="v">${Math.round(flowIn)}<small> m³/s</small></div>`
      + `<div class="k">${T('inflow')}</div>` + (wi ? `<div class="q">${wi}</div>` : '');
  }

  if (outEl && flowVal != null){
    const w = flowState(flowVal, CONFIG.turbine.out);
    outEl.title = T('outflowT', { n:CONFIG.turbine.out.on });
    outEl.innerHTML = `<div class="v">${Math.round(flowVal)}<small> m³/s</small></div>`
      + `<div class="k">${T('outflow')}</div>` + (w ? `<div class="q">${w}</div>` : '');
  }

  const t = trendOf(flowIn, flowVal);
  if (trEl && t){
    // Ohne Erklärung: die Bilanz ist noch zu grob, um sie zu beschreiben —
    // die Sense steckt drin und wird erst herausgerechnet. Siehe CODEBOOK.
    trEl.innerHTML = `<div class="v">${ARROW[t.k]}</div>`
      + `<div class="k">${T('level')}</div><div class="q">${t.word}</div>`;
  }
}

/* Luftqualität kommt von einer eigenen Open-Meteo-Adresse, ebenfalls ohne
   Schlüssel. Nur für heute — für Folgetage liefert sie keinen Tageswert. */
let aqi = null;

async function loadAir(){
  const { lat, lon } = CONFIG.weather;
  try{
    const d = await (await fetch(
      `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}`
      + `&current=european_aqi&timezone=Europe/Zurich`)).json();
    if (d.current && d.current.european_aqi != null) aqi = d.current.european_aqi;
  }catch(e){}
  renderAir();
}

function renderAir(){
  const el = $('#aqi');
  if (!el || aqi == null) return;
  el.title = T('aqT');
  el.innerHTML = `<div class="v">${Math.round(aqi)}</div>`
    + `<div class="k">${T('aq')}</div><div class="q">${aqiWord(aqi)}</div>`;
}

async function loadHydro(){
  const u = `https://api.existenz.ch/apiv1/hydro/latest`
    + `?locations=${CONFIG.hydro.inflow},${CONFIG.hydro.station}`
    + `&parameters=flow&app=${CONFIG.app}&version=1.0`;
  try{
    const d = await (await fetch(u)).json();
    const pick = loc => (d.payload||[]).find(x => x.par === 'flow' && String(x.loc) === loc);
    const out = pick(CONFIG.hydro.station), inn = pick(CONFIG.hydro.inflow);
    if (out) flowVal = out.val;      // live schlägt den stündlichen Stand
    if (inn) flowIn  = inn.val;
  }catch(e){}
  renderFlow();
}

renderTicks(); applyLang(); loadLevel(); loadWeather();
setInterval(loadLevel, 300000);
setInterval(loadWeather, 600000);
</script>
