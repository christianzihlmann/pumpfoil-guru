name: Pegel aktualisieren

on:
  schedule:
    # NUR NOCH NOTNAGEL. Von den geplanten 48 Läufen am Tag kamen Ende August
    # 2026 noch 2 bis 3 an: GitHub verzögert geplante Workflows bei Last und
    # stellt Repos ohne frische Push-Aktivität hinten an. Der verlässliche Takt
    # kommt jetzt von aussen über workflow_dispatch (siehe unten).
    #
    # Minute 19 und 49 statt 0 und 30: zur vollen, halben und Viertelstunde ist
    # der Planer am stärksten ausgelastet. Die kleinen Offsets 5 und 7 nehmen
    # aus demselben Grund viele andere auch.
    - cron: "19,49 * * * *"

  # Der eigentliche Auslöser. Ein externer Cron-Dienst ruft halbstündlich
  #   POST /repos/<user>/pumpfoil-guru/actions/workflows/update-level.yml/dispatches
  #   Authorization: Bearer <fein granuliertes Token, nur actions:write>
  #   {"ref":"main"}
  # API-Aufrufe unterliegen der Drosselung oben NICHT — sie laufen sofort.
  #
  # Wenn der Sensor am Steg kommt, meldet der ohnehin per repository_dispatch
  # und wird damit selbst zum Takt; dieser Block bleibt dann als Rückfall.
  #
  # Faellt der externe Dienst aus oder laeuft das Token ab, hoert die
  # Aktualisierung LAUTLOS auf. Dagegen prueft die Seite das Alter von
  # data/level.json und sagt es an — siehe CONFIG.stale in index.html.
  workflow_dispatch:

permissions:
  contents: write
  issues: write     # für die Kalibrier-Meldung

concurrency:
  group: pegel
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - id: fetch
        run: python scripts/fetch_level.py

      - name: Kalibrierfenster melden
        if: steps.fetch.outputs.narrow == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BAND: ${{ steps.fetch.outputs.band_cm }}
          LO: ${{ steps.fetch.outputs.lo }}
          HI: ${{ steps.fetch.outputs.hi }}
        run: |
          HEUTE=$(date -u +%Y-%m-%d)
          # Der Job laeuft stuendlich — nur eine Meldung pro Tag
          if gh issue list --state all --limit 50 --json title --jq '.[].title' \
             | grep -q "^$HEUTE "; then
            echo "Fuer $HEUTE bereits gemeldet."
            exit 0
          fi
          {
            printf 'Groupe E gibt fuer heute **%s - %s m ue. M.** an.\n\n' "$LO" "$HI"
            printf 'Das sind nur **%s cm** Spanne. An solchen Tagen laesst sich eine\n' "$BAND"
            printf 'Messung am Steg fast eindeutig einem Pegel zuordnen.\n\n'
            printf '**Was tun:**\n\n'
            printf '1. Wassertiefe an der kritischen Stelle messen, an Dock 1 *und* Dock 2 am selben Tag.\n'
            printf '2. **Uhrzeit auf 15 min genau notieren.**\n'
            printf '3. Notieren, ob es geht: gruen / orange / rot.\n\n'
            printf 'Die Differenz zwischen den Docks ist unabhaengig vom Seepegel und macht\n'
            printf 'sie untereinander vergleichbar. Einzelheiten im CODEBOOK.\n\n'
            printf '_Gemeldet von scripts/fetch_level.py, Schwelle NARROW_BAND_CM._\n'
          } > /tmp/issue.md
          gh issue create \
            --title "$HEUTE - Kalibrieren: Pegelspanne nur $BAND cm" \
            --body-file /tmp/issue.md

      - name: Lücke melden — Aktualisierung hat ausgesetzt
        if: steps.fetch.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STUNDEN: ${{ steps.fetch.outputs.stale_hours }}
          SEIT: ${{ steps.fetch.outputs.stale_since }}
        run: |
          MARK="Luecke ab $SEIT"
          # Eine Meldung je Lücke, nicht bei jedem Lauf danach
          if gh issue list --state all --limit 50 --json title --jq '.[].title' \
             | grep -qF "$MARK"; then
            echo "Fuer $SEIT bereits gemeldet."
            exit 0
          fi
          {
            printf 'Zwischen dem letzten erfolgreichen Lauf (**%s**) und diesem\n' "$SEIT"
            printf 'liegen **%s Stunden**. Geplant sind 30 Minuten.\n\n' "$STUNDEN"
            printf 'In dieser Zeit fehlen Archivzeilen. Besonders aergerlich beim\n'
            printf 'VARIO-Preis: der Endpunkt liefert nur den laufenden Tag, was\n'
            printf 'nicht geholt wurde, ist endgueltig weg.\n\n'
            printf '**Wo nachsehen, in dieser Reihenfolge:**\n\n'
            printf '1. Der externe Cron-Dienst — laeuft der Job noch, was sagt sein Log?\n'
            printf '2. Das Token: fein granulierte Tokens laufen ab. Ein 401 dort\n'
            printf '   sieht man nur im Log des Dienstes, nicht hier.\n'
            printf '3. Actions-Tab: kamen Laeufe an und sind rot geworden?\n\n'
            printf '_Gemeldet von scripts/fetch_level.py, Schwelle STALE_HOURS._\n'
          } > /tmp/stale.md
          gh issue create --title "Aktualisierung ausgesetzt: $STUNDEN h ($MARK)" \
            --body-file /tmp/stale.md

      - name: Dock 2 wird knapp — Schwimmsteg raus
        if: steps.fetch.outputs.dock2_alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAGE: ${{ steps.fetch.outputs.dock2_days }}
          AB: ${{ steps.fetch.outputs.dock2_from }}
          LIMIT: ${{ steps.fetch.outputs.dock2_limit }}
        run: |
          MARK="Dock 2 knapp ab $AB"
          # Nur eine Meldung je Trockenphase, nicht alle 30 Minuten eine neue
          if gh issue list --state all --limit 50 --json title --jq '.[].title' \
             | grep -qF "$MARK"; then
            echo "Fuer $AB bereits gemeldet."
            exit 0
          fi
          {
            printf 'Die Groupe-E-Prognose sagt fuer **%s Tage in Folge ab %s** einen\n' "$TAGE" "$AB"
            printf 'Tagestiefstand unter **%s m ue. M.** voraus. Das ist die Gruen-Schwelle\n' "$LIMIT"
            printf 'von Dock 2 — darunter wird das Wasser knapp.\n\n'
            printf '**Zu tun:** Schwimmsteg (Dock 4) mit dem Schiff rausnehmen, bevor es\n'
            printf 'zu flach wird. Danach in data/level.json `dock4_installed` auf `false`.\n\n'
            printf 'Eine Prognose, keine Messung — vor dem Aufwand kurz gegenpruefen.\n\n'
            printf '_Gemeldet von scripts/fetch_level.py, Schwelle DOCK2_ALERT_DAYS._\n'
          } > /tmp/dock2.md
          gh issue create --title "$MARK ($TAGE Tage)" --body-file /tmp/dock2.md

      - name: Commit, falls sich etwas geändert hat
        run: |
          git config user.name  "pegel-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Pegel $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
